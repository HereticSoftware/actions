name: Setup .NET
description: Setup .NET based on global.json
inputs:
  workload-restore:
    description: Run `dotnet workload restore` after installing the SDK.
    default: 'false'
runs:
  using: composite
  steps:
  - name: Setup .NET
    uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
    with:
      global-json-file: global.json

  - name: Workload Restore
    if: inputs.workload-restore == 'true'
    shell: bash
    run: dotnet workload restore
