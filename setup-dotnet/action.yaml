name: Setup .NET
description: Setup .NET based on global.json
inputs:
  workload-restore:
    description: Run `dotnet workload restore` after installing the SDK.
    default: 'false'
runs:
  using: composite
  steps:
  - name: Setup .NET
    uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
    with:
      global-json-file: global.json

  - name: Workload Restore
    if: inputs.workload-restore == 'true'
    shell: bash
    run: dotnet workload restore
